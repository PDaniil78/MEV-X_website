# vhost for mev-x.com on 204.168.153.69.
#
# This box already has a busy front door — see deploy/RUNBOOK.md:
#   :80    Next.js (Homelander app) bound directly, NOT behind nginx
#   :8080  uvicorn
#   :8093  nginx, this static site
#   :443   closed, nothing listening
#
# So the listen directive depends on which path the runbook takes:
#
#   Path A (Cloudflare Tunnel, recommended): keep `listen 8093;` below. TLS is
#   terminated by Cloudflare and cloudflared connects to 127.0.0.1:8093, so
#   nothing here needs a certificate and no port has to be opened.
#
#   Path B (nginx owns 443): swap the listen block for the ssl one that follows
#   it, after freeing :80 and opening :443.
#
# Either way this replaces whatever currently serves :8093.

# Cache policy per URI. Evaluated after try_files' internal redirect, so "/"
# and "/blog/" arrive here as /index.html and /blog/index.html and correctly
# fall through to the no-cache default.
map $uri $mevx_cache {
    default                                 "no-cache";
    ~*\.(?:css|js)$                         "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|webp|svg|ico|woff2?)$   "public, max-age=31536000, immutable";
    ~*^/robots\.txt$                        "public, max-age=3600";
    ~*^/sitemap\.xml$                       "public, max-age=3600";
    ~*^/llms\.txt$                          "public, max-age=3600";
    ~*^/blog/rss\.xml$                      "public, max-age=3600";
}

server {
    listen 8093 default_server;
    listen [::]:8093 default_server;
    server_name mev-x.com www.mev-x.com _;

    # --- Path B: comment out the two listen lines above and use these instead
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/letsencrypt/live/mev-x.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mev-x.com/privkey.pem;

    root /var/www/mev-x-website;
    index index.html;

    # www -> apex. The canonical tag on every page is https://mev-x.com/, so www
    # must not serve a second copy. Scheme is hardcoded because behind a tunnel
    # or a proxy nginx sees plain HTTP and $scheme would send visitors to http://.
    if ($host = www.mev-x.com) { return 301 https://mev-x.com$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    # Cache-Control is chosen by the $mevx_cache map at the top of this file and
    # applied ONCE here, alongside the security headers. This is deliberate:
    # nginx's add_header is not additive across blocks -- a single add_header
    # inside a location silently discards every add_header inherited from the
    # server, so per-location cache rules would strip HSTS and friends off every
    # HTML response. Keeping all add_header directives at this level avoids it.
    add_header Cache-Control $mevx_cache always;
    # Apex only, deliberately: includeSubDomains would make any future
    # HTTP-only subdomain unreachable in browsers that have seen this header.
    # preload goes with it -- the preload list rejects entries without
    # includeSubDomains, so the token would be inert anyway.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never serve the repo's working material, even if a deploy copies it over.
    location ^~ /assets/partners-raw/ { return 404; }
    location ^~ /design/              { return 404; }
    location ^~ /deploy/              { return 404; }
    location = /_variants.html        { return 404; }
    location = /build.sh              { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
