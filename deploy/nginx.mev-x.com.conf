# Reference Nginx config for mev-x.com on the VPS (204.168.153.69).
# Not applied automatically — copy into /etc/nginx/sites-available/mev-x.com,
# symlink into sites-enabled, run `certbot --nginx -d mev-x.com -d www.mev-x.com`
# to obtain certs, then `nginx -t && systemctl reload nginx`.

# Redirect www -> apex (pick one canonical host; canonical tag in index.html is https://mev-x.com/)
server {
    listen 80;
    listen [::]:80;
    server_name www.mev-x.com mev-x.com;

    # Let certbot's ACME challenge through, force HTTPS for everything else
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mev-x.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mev-x.com;

    ssl_certificate     /etc/letsencrypt/live/mev-x.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mev-x.com/privkey.pem;

    return 301 https://mev-x.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mev-x.com;

    root /var/www/mev-x-website;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/mev-x.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mev-x.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTML: always revalidate so content edits go live immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Versioned assets (css/style.css?v=13, js/main.js?v=13) can be cached hard;
    # bump the ?v= query string on deploy to bust the cache.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
